    function initAudioAnalyser() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const srcNode = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        srcNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {
        analyser = null;
      }
    }

    function getBassEnergy(elapsed) {
      if (analyser && freqData && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        let sum = 0;
        for (let i = 0; i < 6; i++) sum += freqData[i];
        return Math.min(1, (sum / (6 * 255)) * 1.25);
      }
      const beatPhase = (elapsed * (106 / 60)) % 1;
      return Math.exp(-beatPhase * 4.8) * 0.35;
    }

    function makeAnimeCloudSprite(w, h, isLowerSunset) {
      const off = document.createElement("canvas");
      off.width = w;
      off.height = h;
      const octx = off.getContext("2d");

      const puffs = [
        { x: 0.50, y: 0.54, rx: 0.42, ry: 0.26, a: 0.42 },
        { x: 0.28, y: 0.58, rx: 0.28, ry: 0.20, a: 0.36 },
        { x: 0.72, y: 0.58, rx: 0.30, ry: 0.20, a: 0.36 },
        { x: 0.40, y: 0.42, rx: 0.26, ry: 0.22, a: 0.38 },
        { x: 0.60, y: 0.44, rx: 0.24, ry: 0.20, a: 0.36 }
      ];

      for (const p of puffs) {
        const cx = p.x * w;
        const cy = p.y * h;
        const rad = Math.max(p.rx * w, p.ry * h);

        octx.save();
        octx.translate(cx, cy);
        octx.scale((p.rx * w) / rad, (p.ry * h) / rad);

        const grad = octx.createRadialGradient(0, -rad * 0.15, rad * 0.05, 0, 0, rad);
        if (isLowerSunset) {
          grad.addColorStop(0, `rgba(248, 224, 198, ${p.a})`);
          grad.addColorStop(0.55, `rgba(232, 194, 168, ${p.a * 0.6})`);
          grad.addColorStop(1, "rgba(232, 194, 168, 0)");
        } else {
          grad.addColorStop(0, `rgba(218, 210, 224, ${p.a})`);
          grad.addColorStop(0.55, `rgba(182, 174, 192, ${p.a * 0.55})`);
          grad.addColorStop(1, "rgba(182, 174, 192, 0)");
        }

        octx.fillStyle = grad;
        octx.beginPath();
        octx.arc(0, 0, rad, 0, Math.PI * 2);
        octx.fill();
        octx.restore();
      }
      return off;
    }

    function buildSkyMask(data, w, h) {
      const rowSkyR = new Float32Array(h);
      const rowSkyG = new Float32Array(h);
      const rowSkyB = new Float32Array(h);

      let lastR = data[0], lastG = data[1], lastB = data[2];
      for (let y = 0; y < h; y++) {
        const samples = [];
        for (const sx of [2, 6, w - 3, w - 7]) {
          const i = (y * w + sx) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const lum = (r + g + b) / 3;
          if (lum > 95 && y < h * 0.72) {
            samples.push([r, g, b]);
          }
        }
        if (samples.length > 0) {
          let sr = 0, sg = 0, sb = 0;
          for (const [r, g, b] of samples) { sr += r; sg += g; sb += b; }
          lastR = sr / samples.length;
          lastG = sg / samples.length;
          lastB = sb / samples.length;
        }
        rowSkyR[y] = lastR;
        rowSkyG[y] = lastG;
        rowSkyB[y] = lastB;
      }

      const mask = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        if (y > h * 0.74) continue;
        const tr = rowSkyR[y];
        const tg = rowSkyG[y];
        const tb = rowSkyB[y];

        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const lum = (r + g + b) / 3;

          if (lum < 92) continue;

          const dr = r - tr;
          const dg = g - tg;
          const db = b - tb;
          const dist = Math.sqrt(dr * dr + dg * dg + db * db);

          if (dist < 28) {
            mask[y * w + x] = dist < 16 ? 1.0 : 1.0 - (dist - 16) / 12;
          }
        }
      }

      return mask;
    }

    function updateLivingFrame(elapsed, windMult, bass) {
      if (!artReady || !srcPixels || !dstPixels) return;

      const w = simW;
      const h = simH;
      const t = elapsed * windMult;
      const breathe = Math.sin(elapsed * 1.3);

      for (let y = 0; y < h; y++) {
        const ny = y / h;
        const rowOffset = y * w * 4;

        const vRightHair = ny > 0.15 && ny < 0.76
          ? Math.sin(((ny - 0.15) / 0.61) * Math.PI)
          : 0;
        const vTailTips = ny > 0.48 && ny < 0.76
          ? Math.sin(((ny - 0.48) / 0.28) * Math.PI)
          : 0;
        const vChinWisps = ny > 0.42 && ny < 0.62
          ? Math.sin(((ny - 0.42) / 0.20) * Math.PI)
          : 0;
        const vShoulders = ny > 0.68 ? (ny - 0.68) / 0.32 : 0;

        const waveMain = Math.sin(ny * 8.0 - t * 2.6);
        const waveFast = Math.cos(ny * 15.0 - t * 4.0 + 0.8) * 0.38;

        for (let x = 0; x < w; x++) {
          const nx = x / w;

          const faceDx = (nx - 0.445) / 0.135;
          const faceDy = (ny - 0.385) / 0.185;
          const faceDist2 = faceDx * faceDx + faceDy * faceDy;
          const faceLock = faceDist2 < 1.0 ? 0.0 : Math.min(1.0, (faceDist2 - 1.0) / 0.85);

          const handDx = (nx - 0.475) / 0.125;
          const handDy = (ny - 0.78) / 0.21;
          const handDist2 = handDx * handDx + handDy * handDy;
          const handLock = handDist2 < 1.0 ? 0.05 : Math.min(1.0, 0.05 + (handDist2 - 1.0) / 0.75);

          const lock = faceLock * handLock;

          const hRight = nx > 0.56 ? Math.min(1.0, (nx - 0.56) / 0.32) : 0;
          const hLeft = nx < 0.32 ? Math.min(1.0, (0.32 - nx) / 0.20) : 0;

          const hairWeight = (hRight * vRightHair * 1.05 + hLeft * vRightHair * 0.35 + vTailTips * hRight * 0.55) * lock;
          const wispWeight = (nx > 0.27 && nx < 0.65 ? vChinWisps * 0.32 : 0) * lock;
          const totalHair = hairWeight + wispWeight;

          const localWave =
            Math.sin(nx * 8.5 - t * 2.8 + ny * 4.0) * 0.60 +
            waveMain * 0.26 +
            waveFast * 0.16;

          const windBoost = windMult * (0.9 + bass * 0.35);
          const dispX = -localWave * (w * 0.011) * totalHair * windBoost;
          const dispY =
            -Math.cos(nx * 7.0 - t * 2.3 + ny * 3.0) * (h * 0.0065) * totalHair * windBoost -
            breathe * (h * 0.0024) * vShoulders;

          let sx = x + dispX;
          let sy = y + dispY;
          if (sx < 0) sx = 0;
          else if (sx > w - 1.001) sx = w - 1.001;
          if (sy < 0) sy = 0;
          else if (sy > h - 1.001) sy = h - 1.001;

          const x0 = sx | 0;
          const y0 = sy | 0;
          const fx = sx - x0;
          const fy = sy - y0;
          const invFx = 1.0 - fx;
          const invFy = 1.0 - fy;

          const w00 = invFx * invFy;
          const w10 = fx * invFy;
          const w01 = invFx * fy;
          const w11 = fx * fy;

          const i00 = (y0 * w + x0) * 4;
          const i10 = i00 + 4;
          const i01 = i00 + w * 4;
          const i11 = i01 + 4;

          let rCol = srcPixels[i00] * w00 + srcPixels[i10] * w10 + srcPixels[i01] * w01 + srcPixels[i11] * w11;
          let gCol = srcPixels[i00 + 1] * w00 + srcPixels[i10 + 1] * w10 + srcPixels[i01 + 1] * w01 + srcPixels[i11 + 1] * w11;
          let bCol = srcPixels[i00 + 2] * w00 + srcPixels[i10 + 2] * w10 + srcPixels[i01 + 2] * w01 + srcPixels[i11 + 2] * w11;

          if (cloudPixels && skyMask) {
            const sMask = skyMask[y0 * w + x0];
            if (sMask > 0.01) {
              const cIdx = rowOffset + x * 4;
              const cAlpha = (cloudPixels[cIdx + 3] / 255) * sMask * 0.85;
              if (cAlpha > 0.002) {
                const invC = 1.0 - cAlpha;
                rCol = rCol * invC + cloudPixels[cIdx] * cAlpha;
                gCol = gCol * invC + cloudPixels[cIdx + 1] * cAlpha;
                bCol = bCol * invC + cloudPixels[cIdx + 2] * cAlpha;
              }
            }
          }

          const dstIdx = rowOffset + x * 4;
          dstPixels[dstIdx] = rCol;
          dstPixels[dstIdx + 1] = gCol;
          dstPixels[dstIdx + 2] = bCol;
          dstPixels[dstIdx + 3] = 255;
        }
      }

      sctx.putImageData(dstImageData, 0, 0);
    }

    function getTrackTimeSec() {
      if (audio.src && !audio.paused && !Number.isNaN(audio.currentTime)) {
        return audio.currentTime;
      }
      const now = isPlaying ? performance.now() : (pausedAt || performance.now());
      return Math.max(0, (now - timerStart - pausedTotal) / 1000);
    }

    function getActivePhrase(tSec) {
      const cycleLen = 148.0;
      const tLoop = Math.max(0, tSec) % cycleLen;

      let active = WORD_TIMELINE[0];
      for (let i = 0; i < WORD_TIMELINE.length; i++) {
        if (tLoop >= WORD_TIMELINE[i].start) {
          active = WORD_TIMELINE[i];
        } else {
          break;
        }
      }
      return { phrase: active, tLoop };
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    // Импульс масштаба: слово быстро вырастает до peakScale при выходе и плавно возвращается в 1.0
    function getWordPopScale(age, peakScale = 1.24, totalDur = 0.36) {
      if (age <= 0) return 0.82;
      if (age >= totalDur) return 1.0;
      const peakTime = totalDur * 0.34;
      if (age < peakTime) {
        const t = age / peakTime;
        const ease = 1 - Math.pow(1 - t, 2);
        return 0.82 + (peakScale - 0.82) * ease;
      } else {
        const t = (age - peakTime) / (totalDur - peakTime);
        const ease = 1 - Math.pow(1 - t, 3);
        return peakScale - (peakScale - 1.0) * ease;
      }
    }

    function renderAnimatedLyrics(w, h, elapsed, bass) {
      const trackSec = getTrackTimeSec();
      const { phrase, tLoop } = getActivePhrase(trackSec);
      const isDream = Boolean(phrase.isDream);
      const mode = LYRIC_MODES[lyricModeIndex].id;

      const timeLeft = Math.max(0, phrase.end - tLoop);
      const exitWindow = 0.30;
      const exitProgress = timeLeft < exitWindow ? Math.max(0, 1 - timeLeft / exitWindow) : 0;
      const exitAlpha = 1 - exitProgress * exitProgress;
      const exitRiseY = -exitProgress * 10;

      // 1. Режим «Одно слово»: крупно по центру с импульсом увеличения при выходе
      if (mode === "soloCenter") {
        let curIdx = -1;
        for (let i = 0; i < phrase.words.length; i++) {
          if (tLoop >= phrase.words[i][0]) {
            curIdx = i;
          } else {
            break;
          }
        }
        if (curIdx < 0) return;

        const [wordStart, wordText] = phrase.words[curIdx];
        const nextWordStart =
          curIdx + 1 < phrase.words.length ? phrase.words[curIdx + 1][0] : phrase.end;
        const wordAge = Math.max(0, tLoop - wordStart);
        const wordTimeLeft = Math.max(0, nextWordStart - tLoop);

        const enterDur = 0.22;
        const p = Math.min(1, wordAge / enterDur);
        const eased = easeOutCubic(p);
        const wordFadeOut = wordTimeLeft < 0.12 ? Math.max(0, wordTimeLeft / 0.12) : 1;
        const alpha = Math.min(1, p * 2.0) * wordFadeOut * exitAlpha;
        if (alpha <= 0.01) return;

        const fontSize = Math.max(28, Math.round(w * (isDream ? 0.044 : 0.036)));
        const baseY = h - Math.max(46, h * 0.072) + exitRiseY + (1 - eased) * 14;
        const scale = getWordPopScale(wordAge, 1.26, 0.36) + bass * 0.03;
        const flash = Math.max(0, 1 - wordAge / 0.34);

        ctx.save();
        ctx.translate(w / 2, baseY);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;
        ctx.font = `bold ${fontSize}px Consolas, "DejaVu Sans Mono", monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.shadowColor = isDream
          ? "rgba(255, 196, 224, 0.85)"
          : `rgba(255, 214, 192, ${(0.35 + flash * 0.65).toFixed(2)})`;
        ctx.shadowBlur = isDream ? 20 : 12 + flash * 10;

        ctx.fillStyle = flash > 0.2 ? "#ffffff" : (isDream ? "#ffe4ee" : "#ffe6d4");
        ctx.fillText(wordText, 0, 0);
        ctx.restore();
        return;
      }

      // 2. Режимы «Слово за словом» и «Караоке»
      const subFontSize = Math.max(20, Math.round(w * (isDream ? 0.031 : 0.024)));
      ctx.font = `bold ${subFontSize}px Consolas, "DejaVu Sans Mono", monospace`;
      ctx.textBaseline = "middle";

      const spaceW = ctx.measureText(" ").width * (isDream ? 1.32 : 1.18);
      const wordItems = phrase.words.map(([wStart, wText], idx) => {
        const wAge = tLoop - wStart;
        const width = ctx.measureText(wText).width;
        const appearWeight =
          mode === "wordByWord"
            ? (wAge >= 0 ? easeOutCubic(Math.min(1, wAge / 0.16)) : 0)
            : 1;
        return { wStart, wText, idx, wAge, width, appearWeight };
      });

      let visibleTotalWidth = 0;
      let startedCount = 0;
      for (const item of wordItems) {
        if (item.appearWeight > 0) {
          if (startedCount > 0) visibleTotalWidth += spaceW * item.appearWeight;
          visibleTotalWidth += item.width * item.appearWeight;
          startedCount++;
        }
      }

      if (startedCount === 0) return;

      const baseY = h - Math.max(38, h * 0.06) + exitRiseY;
      let cursorX = (w - visibleTotalWidth) / 2;

      for (const item of wordItems) {
        if (mode === "wordByWord" && item.wAge < 0) continue;

        const effectiveW = item.width * item.appearWeight;
        const wordCenterX = cursorX + effectiveW / 2;
        cursorX += effectiveW + spaceW * item.appearWeight;

        const isSung = item.wAge >= 0;
        const enterDur = 0.24;
        const p = isSung ? Math.min(1, item.wAge / enterDur) : 0;
        const eased = isSung ? easeOutCubic(p) : 0;
        const flash = isSung ? Math.max(0, 1 - item.wAge / 0.38) : 0;

        let alpha = exitAlpha;
        let offsetY = 0;
        let scale = 1;
        let rot = 0;

        if (mode === "wordByWord") {
          alpha *= Math.min(1, p * 2.0);
          offsetY = (1 - eased) * 14 + Math.sin(elapsed * 2.6 + item.idx * 0.7) * (1.4 + bass * 1.6);
          scale = getWordPopScale(item.wAge, 1.24, 0.36);
          rot = (1 - eased) * (item.idx % 2 === 0 ? -0.035 : 0.035);
        } else {
          alpha *= isSung ? 1.0 : 0.26;
          offsetY = isSung ? (1 - eased) * 8 - flash * 3 : 0;
          scale = isSung ? getWordPopScale(item.wAge, 1.22, 0.34) : 0.96;
        }

        if (alpha <= 0.01) continue;

        ctx.save();
        ctx.translate(wordCenterX, baseY + offsetY);
        ctx.rotate(rot);
        ctx.scale(scale, scale);
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.textAlign = "center";

        if (isSung && (isDream || flash > 0.05)) {
          ctx.shadowColor = isDream
            ? `rgba(255, 200, 224, ${(0.55 + flash * 0.45).toFixed(2)})`
            : `rgba(255, 214, 192, ${(flash * 0.9).toFixed(2)})`;
          ctx.shadowBlur = isDream ? 16 + bass * 8 : 14 * flash;
        } else {
          ctx.shadowColor = "rgba(0, 0, 0, 0.92)";
          ctx.shadowBlur = 8;
        }

        if (!isSung) {
          ctx.fillStyle = "#cbb8b4";
        } else if (isDream) {
          ctx.fillStyle = flash > 0.18 ? "#ffffff" : "#ffe4ee";
        } else if (flash > 0.15) {
          ctx.fillStyle = "#ffffff";
        } else {
          ctx.fillStyle = item.idx % 2 === 0 ? "#f7d9bd" : "#ffdce4";
        }

        ctx.fillText(item.wText, 0, 0);
        ctx.restore();
      }
    }

    function startPlayback() {
      isPlaying = true;
      if (pausedAt > 0) {
        pausedTotal += performance.now() - pausedAt;
        pausedAt = 0;
      }
      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      if (audio.src) {
        audio.volume = 1.0;
        audio.play().then(() => {
          statusEl.textContent = "Играет";
        }).catch(() => {
          statusEl.textContent = "Нажми Play ещё раз для звука";
        });
      }
    }

    function togglePlay() {
      if (!isPlaying) {
        startPlayback();
      } else {
        isPlaying = false;
        pausedAt = performance.now();
        if (audio.src) audio.pause();
        statusEl.textContent = "Пауза";
      }
    }

    function restartAll() {
      timerStart = performance.now();
      pausedTotal = 0;
      pausedAt = 0;
      isPlaying = true;
      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      if (audio.src) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
      statusEl.textContent = "Перезапуск";
    }

    windBtn.addEventListener("click", () => {
      windIndex = (windIndex + 1) % WIND_MODES.length;
      windBtn.textContent = `Ветер: ${WIND_MODES[windIndex].label}`;
    });

    lyricAnimBtn.addEventListener("click", () => {
      lyricModeIndex = (lyricModeIndex + 1) % LYRIC_MODES.length;
      lyricAnimBtn.textContent = `Текст: ${LYRIC_MODES[lyricModeIndex].label}`;
    });

    document.getElementById("playBtn").addEventListener("click", togglePlay);
    document.getElementById("restartBtn").addEventListener("click", restartAll);
    document.getElementById("hideHudBtn").addEventListener("click", () => hud.classList.toggle("hidden"));

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.key === "h" || e.key === "H" || e.key === "р" || e.key === "Р") {
        hud.classList.toggle("hidden");
      } else if (e.key === "r" || e.key === "R" || e.key === "к" || e.key === "К") {
        restartAll();
      }
    });

    document.getElementById("photoInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => prepareImage(img);
      img.src = URL.createObjectURL(file);
    });

    document.getElementById("audioInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      audio.src = URL.createObjectURL(file);
      restartAll();
      statusEl.textContent = `Аудио: ${file.name}`;
    });

    function loadAssets() {
      const img = new Image();
      img.onload = () => prepareImage(img);
      img.onerror = () => {
        statusEl.textContent = "rezephoto.jpg не найден — выбери фото кнопкой";
      };
      img.src = "rezephoto.jpg";

      audio.src = encodeURI("Eyedress & Dent May - Something About You.mp3");
    }

    let lastFrame = performance.now();

    function render(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      const elapsed = now / 1000;
      const w = window.innerWidth;
      const h = window.innerHeight;

      const windMult = WIND_MODES[windIndex].mult;
      const bass = getBassEnergy(elapsed);

      ctx.fillStyle = "#0e0d12";
      ctx.fillRect(0, 0, w, h);

      if (artReady) {
        updateCloudsBuffer(dt, windMult);
        if (isPlaying) {
          updateLivingFrame(elapsed, windMult, bass);
        }

        ctx.save();
        ctx.globalAlpha = 0.72;
        ctx.drawImage(bgCanvas, 0, 0, w, h);
        ctx.restore();

        const artAspect = simW / simH;
        let drawH = h;
        let drawW = drawH * artAspect;
        if (drawW > w) {
          drawW = w;
          drawH = drawW / artAspect;
        }
        const drawX = (w - drawW) / 2;
        const drawY = (h - drawH) / 2;

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(simCanvas, drawX, drawY, drawW, drawH);

        const scaleX = drawW / simW;
        const scaleY = drawH / simH;
        for (const m of dustMotes) {
          if (isPlaying) {
            m.x += m.vx * windMult * dt;
            m.y += m.vy * dt;
            if (m.x > simW) m.x = 0;
            if (m.y < 0) m.y = simH * 0.75;
          }
          const ix = Math.max(0, Math.min(simW - 1, m.x | 0));
          const iy = Math.max(0, Math.min(simH - 1, m.y | 0));
          if (skyMask && skyMask[iy * simW + ix] > 0.3) {
            const tw = 0.45 + 0.55 * Math.sin(elapsed * 2.1 + m.phase);
            ctx.fillStyle = `rgba(255, 244, 232, ${(m.alpha * tw).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(drawX + m.x * scaleX, drawY + m.y * scaleY, m.r * scaleX, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      renderAnimatedLyrics(w, h, elapsed, bass);

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);
    resize();
    loadAssets();
    requestAnimationFrame(render);
  </script>
</body>
